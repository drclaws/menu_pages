# Runs the unit tests and the repository hygiene checks, then builds the
# example data sets and checks the pages.  No secrets, nothing is deployed.
name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

defaults:
  run:
    shell: bash

env:
  PYTHONDONTWRITEBYTECODE: "1"

jobs:
  test:
    name: Tests (Python ${{ matrix.python }})
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # site/: the invitations builder, whose code the menu builder loads
          submodules: true

      - name: Set up Python ${{ matrix.python }}
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}

      - name: Repository hygiene (no tracked media, no tracked build output)
        run: |
          set -euo pipefail
          # Names are read NUL-separated and unquoted, so non-ASCII names are matched as is.
          tracked() {
            git -c core.quotePath=false ls-files -z -- "$@" | tr '\0' '\n'
          }
          names="$(git -c core.quotePath=false ls-files -z | tr -cd '\0' | wc -c)"
          lines="$(tracked | wc -l)"
          returns="$(tracked | grep -ac $'\r' || true)"
          if [ "$names" -ne "$lines" ] || [ "$returns" -ne 0 ]; then
            echo "Tracked file names must not contain line breaks or carriage returns" >&2
            exit 1
          fi
          # Every tracked file is checked: the repository carries no media at all.
          media="$(tracked | grep -aEi '\.(png|jpe?g|webp|gif|avif|mp4|mov|webm|ico|svg)$' || true)"
          if [ -n "$media" ]; then
            echo "Media files must not be tracked:" >&2
            echo "$media" >&2
            exit 1
          fi
          output="$(tracked dist)"
          if [ -n "$output" ]; then
            echo "Generated files must not be tracked:" >&2
            echo "$output" >&2
            exit 1
          fi
          echo "OK: no tracked media or build output"

      - name: No Cyrillic in tracked files
        run: |
          set -euo pipefail
          # Every tracked file of this repository, read as UTF-8.  The submodule is a
          # single entry of the listing (its directory) and is not entered.  A name or
          # a file that is not UTF-8 is refused too: Cyrillic in another encoding would
          # go unseen.  Only file names and line numbers are printed, never the text.
          git ls-files -z | python -c '
          import os, sys
          def cyrillic(text):
              return any(0x400 <= ord(char) <= 0x4FF for char in text)
          found = []
          for raw in sys.stdin.buffer.read().split(b"\0"):
              if not raw:
                  continue
              name = raw.decode("utf-8", "replace")
              try:
                  if cyrillic(raw.decode("utf-8")):
                      found.append(f"{name}: in the file name")
                  if os.path.isfile(raw):
                      with open(raw, "rb") as handle:
                          text = handle.read().decode("utf-8")
                      found += [f"{name}:{number}" for number, line in
                                enumerate(text.split("\n"), 1) if cyrillic(line)]
              except UnicodeDecodeError:
                  found.append(f"{name}: not UTF-8")
          if found:
              print("Tracked files must be UTF-8 without Cyrillic:", *found, sep="\n", file=sys.stderr)
              sys.exit(1)
          '
          echo "OK: no Cyrillic in tracked files"

      - name: Unit tests
        run: |
          set -euo pipefail
          python -m unittest discover -s tests -t .

      - name: Validate and build the main example set
        run: |
          set -euo pipefail
          python build.py validate
          python build.py build --out "$RUNNER_TEMP/dist"

      - name: Validate and build the set without a table
        run: |
          set -euo pipefail
          python build.py validate --data examples/data-plain
          python build.py build --data examples/data-plain --out "$RUNNER_TEMP/dist-plain"

      - name: Build the main example set under a base path
        run: |
          set -euo pipefail
          # the layout a real site uses: the menu in a directory of the site
          python build.py build --base-path /menu --out "$RUNNER_TEMP/site/menu"

      - name: Check the built pages
        run: |
          set -euo pipefail
          # Only counts and the output directories are printed, never a token.
          python - examples/data "$RUNNER_TEMP/dist" examples/data-plain "$RUNNER_TEMP/dist-plain" \
            examples/data "$RUNNER_TEMP/site/menu" <<'PY'
          import json, re, sys
          from pathlib import Path
          for data, out in zip(map(Path, sys.argv[1::2]), map(Path, sys.argv[2::2])):
              records = json.loads((data / "guests.json").read_text(encoding="utf-8"))
              tokens = [record["token"] for record in records]
              staff = [record["token"] for record in records if record.get("staff") is True]
              top = sorted(path.name for path in out.iterdir())
              assert top == sorted(["assets", *tokens]), f"{out}: the top holds more than assets/ and a directory per record"
              for token in tokens:
                  names = [path.name for path in (out / token).iterdir()]
                  assert names == ["index.html"], f"{out}: a directory of a page holds more than index.html"
                  page = (out / token / "index.html").read_text(encoding="utf-8")
                  assert not re.search(r"(?i)\sstyle\s*=", page), f"{out}: a page has a style attribute"
                  assert "{token}" not in page, f"{out}: a page has the placeholder of a token"
                  assert not re.search(r"(?i)<a[\s/>]", page), f"{out}: a page has a link"
              assets = sorted(path.name for path in (out / "assets").iterdir())
              assert assets == ["app.css", "app.js", "favicon.svg"], f"{out}/assets: {assets}"
              # a token is the name of the directory of its page and nothing else
              lowered = [token.lower() for token in tokens]
              for path in sorted(out.rglob("*")):
                  if path.is_file():
                      text = path.read_text(encoding="utf-8").lower()
                      assert not any(token in text for token in lowered), f"{out}: a file holds the token of a record"
              assert len(staff) == 1, f"{data}: no staff record"
              page = (out / staff[0] / "index.html").read_text(encoding="utf-8")
              assert '<meta name="robots" content="noindex, nofollow">' in page, f"{out}: the staff page has no robots tag"
              print(f"OK: {out} ({len(tokens)} page(s))")
          PY

      - name: Reproducible build
        run: |
          set -euo pipefail
          python build.py build --out "$RUNNER_TEMP/dist2"
          tree_hash() {
            (cd "$1" && find . -type f -print0 | LC_ALL=C sort -z | xargs -0 sha256sum)
          }
          tree_hash "$RUNNER_TEMP/dist" > "$RUNNER_TEMP/dist.sha256"
          tree_hash "$RUNNER_TEMP/dist2" > "$RUNNER_TEMP/dist2.sha256"
          test -s "$RUNNER_TEMP/dist.sha256"
          diff "$RUNNER_TEMP/dist.sha256" "$RUNNER_TEMP/dist2.sha256"
          echo "OK: two builds are identical"

      - name: Working tree stays clean
        run: |
          set -euo pipefail
          status="$(git status --porcelain)"
          if [ -n "$status" ]; then
            echo "The tests left untracked or modified files:" >&2
            echo "$status" >&2
            exit 1
          fi
          echo "OK: working tree is clean"
