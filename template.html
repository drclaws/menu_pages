<!doctype html><!-- if:isStaff -->
<html lang="en" class="menu menu--staff"><!-- endif --><!-- if:!isStaff -->
<html lang="en" class="menu menu--guest"><!-- endif -->
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="only light">
  <meta name="theme-color" content="{{themeColor}}">
  <meta name="text-scale" content="scale">
  <meta name="referrer" content="no-referrer">
  <meta name="robots" content="noindex, nofollow">
  <title>Dinner menu · {{coupleNames}}</title>
  <link rel="icon" href="{{faviconPath}}" type="image/svg+xml">
  <link rel="stylesheet" href="{{assetsPath}}/app.css">
  <script src="{{assetsPath}}/app.js" defer></script>
</head>
<body>

<!-- The frame of a menu page. The sections come in order from partials/sections:
     each one is the fragment of its type (sections/cover, sections/custom), the
     widgets are the fragments widgets/<type>. The markup of sections and widgets
     lives in fragments/; here are only the head, the staff bar, the line of the
     sections, the main element and the staff footer.
     The line of the sections (partials/section-nav) stands right before the main
     element, the first element of the body of a guest page: it links the
     sections of the page that have a label (nav) and is left out when none has.
     The class of the html element names the audience (guest or staff): the style
     sheet aligns and sizes the page by it. The staff bar and the footer with the
     contact on the night exist on the staff page alone, outside the sections, so
     they stay even without a cover; the footer is left out when there is neither
     a contact nor a reminder. The title is the same on every page; the pages have
     no link preview tags (a menu link is not meant for sharing) and ask search
     engines to keep away. Every address is a path from the root of the site: the
     styles, the script and the icon live in assetsPath.
     Conditions stand in the lines of the markup: a missing value leaves no empty
     line behind. -->
<!-- if:isStaff -->
<header class="staff-bar">
  <p class="container staff-bar__inner"><strong class="staff-bar__title">Staff version · not for guests</strong><!-- if:staff.updated --> <span class="staff-bar__updated">updated {{staff.updated}}</span><!-- endif --></p>
</header>
<!-- endif --><!-- if:nav --><!-- include:partials/section-nav --><!-- endif -->
<main class="page">
<!-- include:partials/sections -->
</main>
<!-- if:isStaff --><!-- if:staff.contact -->
<footer class="page-footer">
  <div class="container">
    <div class="card staff-footer">
      <p class="staff-footer__contact">Contact on the night: {{staff.contact}}</p><!-- if:staff.reminder -->
      <p>{{staff.reminder}}</p><!-- endif -->
    </div>
  </div>
</footer><!-- endif --><!-- if:!staff.contact --><!-- if:staff.reminder -->
<footer class="page-footer">
  <div class="container">
    <div class="card staff-footer">
      <p>{{staff.reminder}}</p>
    </div>
  </div>
</footer><!-- endif --><!-- endif --><!-- endif -->

</body>
</html>
