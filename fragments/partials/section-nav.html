<!-- The line of the sections at the top of the page; expects in the page root: nav[] (label, target - the domId of a section of the page). The template includes it only when nav is not empty. A link per section, in the order of the page: a plain link to a part of the page, nothing is hidden or switched. The hooks of the sectionNav module of the script: data-section-nav on the line, data-section-nav-list on the list (it scrolls sideways when the links do not fit) and data-section-nav-link on every link; with the script the link of the section in view carries aria-current. The style sheet keeps the line at the top of the screen and leaves it out of print. The label of the landmark is a word of the interface; the labels of the links come from the data. -->
<nav class="section-nav" aria-label="Sections" data-section-nav>
  <div class="container section-nav__inner">
    <ul class="section-nav__list" role="list" data-section-nav-list><!-- each:nav -->
      <li class="section-nav__item"><a class="section-nav__link" href="#{{.target}}" data-section-nav-link>{{.label}}</a></li><!-- endeach -->
    </ul>
  </div>
</nav>
