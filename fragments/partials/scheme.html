<!-- The table plan; expects in `.`: the scheme object - width, height, hidden, tableLabel, total, mine, single, outline, couple (null, or text, x, y, vertical), seats[] (number, cx, cy, r, kind, mark, ring, ringR), badges[] (letter, cx, cy, r), labels[] (isYou, isPlusOne, x, y, anchor); in the page root: isStaff. An inline SVG drawn from the numbers of the object alone, in layers: the outline of the table, the couple label (turned upright on a vertical arm), the seats, the badges of the dietary notes, the labels of the guest's seats. The guest page names the drawing as one image (the table, its seats, the guest's own seats); the staff page hides it from screen readers, its table of the seats says the same in text. Only the staff page prints the badges, only the guest page the labels and the guest's own seats. Colours, lines and type sizes come from the style sheet by class; nothing in the drawing can be clicked or focused. -->
<svg class="scheme" viewBox="0 0 {{.width}} {{.height}}" width="{{.width}}" height="{{.height}}" focusable="false"<!-- if:.hidden --> aria-hidden="true"<!-- endif --><!-- if:!.hidden --><!-- if:!isStaff --> role="img" aria-label="Table plan: {{.tableLabel}}, {{.total}} seats. <!-- if:.single -->Your seat<!-- endif --><!-- if:!.single -->Your seats<!-- endif -->: {{.mine}}"<!-- endif --><!-- endif -->>
<path class="scheme__table" d="{{.outline}}"/>
<!-- with:.couple --><!-- if:!.vertical --><text class="scheme__couple" x="{{.x}}" y="{{.y}}">{{.text}}</text><!-- endif --><!-- if:.vertical --><text class="scheme__couple" x="{{.x}}" y="{{.y}}" transform="rotate(-90 {{.x}} {{.y}})">{{.text}}</text><!-- endif --><!-- endwith -->
<!-- each:.seats --><g class="seat seat--{{.kind}} seat--{{.mark}}"><!-- if:.ring --><circle class="seat__ring" cx="{{.cx}}" cy="{{.cy}}" r="{{.ringR}}"/><!-- endif --><circle class="seat__circle" cx="{{.cx}}" cy="{{.cy}}" r="{{.r}}"/><text class="seat__number" x="{{.cx}}" y="{{.cy}}">{{.number}}</text></g>
<!-- endeach --><!-- if:isStaff --><!-- each:.badges --><g class="seat-badge"><circle class="seat-badge__circle" cx="{{.cx}}" cy="{{.cy}}" r="{{.r}}"/><text class="seat-badge__letter" x="{{.cx}}" y="{{.cy}}">{{.letter}}</text></g>
<!-- endeach --><!-- endif --><!-- if:!isStaff --><!-- each:.labels --><text class="seat-label seat-label--{{.anchor}}" x="{{.x}}" y="{{.y}}"><!-- if:.isYou -->You<!-- endif --><!-- if:.isPlusOne -->+1<!-- endif --></text>
<!-- endeach --><!-- endif --></svg>
