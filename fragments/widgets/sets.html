<!-- The set switcher; expects in `.`: domId, labelledBy, items[] (a set - domId, title, hint, eyebrow, courses[] of dishes, pairing, swapLines[]), note, multiple; in the page root: isStaff. The hooks of the tabs module of the script: data-tabs on the widget, the tab list (data-tabs-tablist, hidden until the script shows it), its tabs (data-tabs-tab, each naming its card by aria-controls) and the cards (data-tabs-panel). Without the script the tab list stays hidden and the cards follow each other; with it one card shows under the tabs. A single set has no tab list. A card: the title (h3) with its eyebrow, the numbered courses, the pairing and, on the staff page, the swaps; the note stands under the cards. The switcher only shows the sets: nothing is chosen or sent here. -->
<div class="widget sets-widget sets" id="{{.domId}}" data-tabs><!-- if:.multiple -->
  <div class="sets__tabs" role="tablist" aria-labelledby="{{.labelledBy}}" data-tabs-tablist hidden>
    <!-- each:.items -->
    <button class="sets__tab" type="button" role="tab" id="{{.domId}}--tab" aria-controls="{{.domId}}" aria-selected="false" tabindex="-1" data-tabs-tab>
      <span class="sets__tab-title">{{.title}}</span><!-- if:.hint -->
      <span class="sets__tab-hint">{{.hint}}</span><!-- endif -->
    </button>
    <!-- endeach -->
  </div><!-- endif -->
  <div class="sets__panels">
    <!-- each:.items -->
    <article class="card sets__panel" id="{{.domId}}" aria-labelledby="{{.domId}}--title" data-tabs-panel>
      <header class="sets__head">
        <h3 class="sets__title" id="{{.domId}}--title">{{.title}}</h3><!-- if:.eyebrow -->
        <p class="sets__eyebrow">{{.eyebrow}}</p><!-- endif -->
      </header>
      <ol class="dishes sets__courses" role="list">
        <!-- each:.courses --><!-- include:partials/dish-item --><!-- endeach -->
      </ol><!-- if:.pairing -->
      <p class="note-line sets__pairing">Paired with {{.pairing}}</p><!-- endif --><!-- if:isStaff --><!-- if:.swapLines -->
      <div class="sets__swaps"><!-- each:.swapLines -->
        <p class="note-line">{{.}}</p><!-- endeach -->
      </div><!-- endif --><!-- endif -->
    </article>
    <!-- endeach -->
  </div><!-- if:.note -->
  <p class="note-line sets__note">{{.note}}</p><!-- endif -->
</div>
