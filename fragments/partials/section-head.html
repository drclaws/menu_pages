<!-- The head of a section; expects in `.`: titleId, title, eyebrow ("" - none). The title is the h2 of the section; the eyebrow, in small capitals, stands under it. -->
<header class="section__head">
  <h2 class="section__title" id="{{.titleId}}">{{.title}}</h2><!-- if:.eyebrow -->
  <p class="section__subtitle">{{.eyebrow}}</p><!-- endif -->
</header>
