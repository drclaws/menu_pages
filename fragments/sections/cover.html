<!-- The cover; expects in `.`: domId, titleId; in the page root: isStaff, coupleNames, event (title, when, place), counters (guests, notes, guestsText, notesText, tableLabel). A compact head, not a whole screen. The guest sees the names in small capitals, the title of the event as the only h1, the accent line, the time and the place. The staff page shows the names and the title of the event in small capitals, the time as the h1, the place and the counters: the guests and the table in plain pills, the dietary notes in an orange one (each only when there is something to count). No reveal mark: the cover is the first screen. -->
<!-- if:!isStaff -->
<section class="cover" id="{{.domId}}" aria-labelledby="{{.titleId}}">
  <div class="container cover__inner">
    <p class="section__subtitle cover__eyebrow">{{coupleNames}}</p>
    <h1 class="cover__title" id="{{.titleId}}">{{event.title}}</h1>
    <hr class="divider divider--accent cover__divider">
    <p class="cover__when">{{event.when}}</p>
    <p class="cover__place">{{event.place}}</p>
  </div>
</section>
<!-- endif -->
<!-- if:isStaff -->
<section class="cover cover--staff" id="{{.domId}}" aria-labelledby="{{.titleId}}">
  <div class="container cover__inner">
    <p class="section__subtitle cover__eyebrow">{{coupleNames}} · {{event.title}}</p>
    <h1 class="cover__title" id="{{.titleId}}">{{event.when}}</h1>
    <p class="cover__place">{{event.place}}</p>
    <ul class="pills cover__counters" role="list"><!-- if:counters.guests -->
      <li class="pill pill--plain">{{counters.guestsText}}</li><!-- endif --><!-- if:counters.tableLabel -->
      <li class="pill pill--plain">{{counters.tableLabel}}</li><!-- endif --><!-- if:counters.notes -->
      <li class="pill pill--flag">{{counters.notesText}}</li><!-- endif -->
    </ul>
  </div>
</section>
<!-- endif -->
